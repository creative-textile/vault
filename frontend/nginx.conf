# Docker DNS resolver (127.0.0.11 — встроенный DNS Docker)
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Прокси API запросов на backend
    # Используем переменную для upstream, чтобы резолвить hostname лениво
    # при первом запросе, а не при старте nginx (решает race-condition с docker DNS)
    location /api/ {
        set $backend_host "http://backend:8000";
        proxy_pass $backend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # WebSocket (Socket.io для ракеты и уведомлений)
    location /socket.io/ {
        set $backend_ws "http://backend:8000";
        proxy_pass $backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
    }

    # Статические ассеты с кешированием
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html НЕ кешируем. Без явных заголовков браузер кеширует его
    # эвристически (по Last-Modified) и после пересборки отдаёт старую страницу
    # со ссылками на старые хешированные бандлы: обновление «не применяется»,
    # пока не нажмёшь Ctrl+Shift+R. Сами бандлы кешируем на 30 дней — их имена
    # содержат хеш содержимого и меняются при каждой сборке.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    # SPA fallback — все остальные запросы отдать index.html
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

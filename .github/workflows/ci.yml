name: CI

# Минимальная проверка на каждый push и pull request: типы, смоук-тесты,
# схема БД на настоящем PostgreSQL и сборка всех четырёх образов.
#
# Почему это появилось: в репозитории не было ни одной автоматической проверки,
# поэтому вторая копия схемы (db/init.sql) успела разойтись с основной и
# сломать инициализацию свежего Docker-тома — ошибка 42P01 всплывала только
# у того, кто поднимал проект с нуля.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Шагу «Сводный кадр для агента» нужно право коммитить в ветку.
# Остальные job'ы получают ровно те права, что и раньше.
permissions:
  contents: write

jobs:
  backend:
    name: "Backend: типы и смоук-тесты"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: TypeScript без ошибок
        run: npx tsc --noEmit
      # Смоук-тесты работают на pg-mem (живая БД не нужна): даты сейфа, цепочка
      # раундов, правила взлома, HTTP-маршруты, дуэли, вклады и гонки денег.
      - name: Смоук-тесты (7 режимов)
        run: npm test

  schema:
    name: Схема БД на PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault_pass
          POSTGRES_DB: vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: vault
      PGPASSWORD: vault_pass
      PGDATABASE: vault
    steps:
      - uses: actions/checkout@v4
      # Так же, как это делает docker-entrypoint-initdb.d: один файл, одна
      # транзакция, ON_ERROR_STOP=1 — любая ошибка означает красную сборку.
      - name: init.sql применяется целиком
        run: psql -v ON_ERROR_STOP=1 -f backend/src/db/init.sql
      - name: init.sql идемпотентен (второй прогон)
        run: psql -v ON_ERROR_STOP=1 -f backend/src/db/init.sql
      - name: Проверка полноты схемы
        run: psql -v ON_ERROR_STOP=1 -f backend/src/db/schema-check.sql

  frontend:
    name: "Frontend: типы и сборка"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Математика 3D-анимаций и линт шейдеров
        run: npm test
      - run: npm run build

      # 👁 ГЛАЗА АГЕНТА: настоящий Chromium снимает 3D-сцены в PNG.
      # Числа проверяют математику, но не проверяют, что на экране что-то
      # нарисовалось (чёрный кадр, уехавшая камера, лопнувший материал).
      # Кадры уезжают артефактом — агент скачивает и смотрит их глазами.
      - name: Браузер для кадров сцен
        run: npx playwright install --with-deps chromium
      - name: Кадры 3D-сцен
        run: node tests/eyes/frames.mjs --frames 12
      - name: Артефакт с кадрами
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-frames
          path: frontend/frames/
          if-no-files-found: warn
          retention-days: 14

      # Песочница агента НЕ может скачать артефакт: blob-хранилище GitHub
      # (productionresultssa*.blob.core.windows.net) в белом списке отсутствует,
      # зато api.github.com открыт. Поэтому сводная картинка кладётся в ветку —
      # агент читает её через API и СМОТРИТ глазами.
      # [skip ci] — чтобы коммит не запускал новый прогон.
      - name: Сводный кадр для агента
        if: always()
        run: |
          # ВНИМАНИЕ: у этого job working-directory = frontend, поэтому пути
          # ниже отсчитываются от frontend/, а не от корня репозитория.
          LOG=/tmp/eyes.log
          : >$LOG
          set +e
          {
          echo "== cwd: $(pwd) =="
          ls -la frames/ | head -8
          cd frames || exit 3
          command -v montage >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq imagemagick; }
          montage $(ls frame-*.png 2>/dev/null | head -6) -tile 3x2 -geometry 320x320+4+4 -background '#05060f' preview.jpg
          [ -f preview.jpg ] || cp frame-000.png preview.jpg
          ls -la preview.jpg
          } >>$LOG 2>&1
          cd "$GITHUB_WORKSPACE/frontend"
          if [ -f frames/preview.jpg ]; then
            B64=$(base64 -w0 frames/preview.jpg)
            { echo '<details><summary>Кадр 3D-сцены</summary>'; echo "<img src=\"data:image/jpeg;base64,$B64\" width=\"640\">"; echo '</details>'; } >> $GITHUB_STEP_SUMMARY
          fi
          { echo '```'; cat $LOG; echo '```'; } >> $GITHUB_STEP_SUMMARY
          # Картинку кладём в ветку: blob-хранилище артефактов песочнице недоступно,
          # а api.github.com открыт — оттуда агент читает файл и смотрит глазами.
          cd "$GITHUB_WORKSPACE"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git config user.name "vault-eyes"
          git config user.email "eyes@vault.local"
          git add -f frontend/frames/preview.jpg
          git commit -q -m "chore(eyes): сводный кадр сцен [skip ci]" || echo "нечего коммитить"
          echo "push $(git rev-parse --short HEAD) -> $BRANCH" >> $GITHUB_STEP_SUMMARY
          git push -q origin "HEAD:$BRANCH" || echo "push не удался (не критично)"
          true

  bot:
    name: "Telegram-бот: типы и сборка"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker-образы собираются
    runs-on: ubuntu-latest
    needs: [backend, schema, frontend, bot]
    steps:
      - uses: actions/checkout@v4
      - name: Образ БД (контекст — корень, схема из backend/src/db/init.sql)
        run: docker build -f db/Dockerfile -t vault-db:ci .
      - name: Backend
        run: docker build -t vault-backend:ci ./backend
      - name: Frontend
        run: docker build -t vault-frontend:ci ./frontend
      - name: Bot
        run: docker build -t vault-bot:ci ./bot
      # Композ проверяется отдельно: он поднимает БД из того же Dockerfile и
      # ждёт её healthcheck, то есть воспроизводит «docker compose up» с нуля.
      - name: docker compose config валиден
        run: |
          cp .env.example .env
          docker compose config --quiet

  # Транспорт агентов (ScriptCat) живёт в этом же репозитории, поэтому он не может
  # остаться без гейта: сборка, переносимость, пробы и узел допуска к установке.
  # Проверки фиксированы в tools/relay-build.mjs и не читаются из package.json.
  scriptcat:
    name: "ScriptCat: сборка, guard, пробы, узел"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сборка соответствует исходникам
        run: node tools/script-cat/build.mjs --check
      - name: Переносимый комплект без прежних имён
        run: node tools/script-cat/portability-guard.mjs
      - name: Пробы транспорта
        run: npm test
      - name: Регрессии транспорта
        run: npm run test:regression
      - name: Продолжение после tool-call limit
        run: npm run test:tool-limit
      # Без --base: гейт путей сверяет только рабочее дерево (в CI оно чистое).
      # Сравнение с базовой ревизией (D-027) требует правки только транспорта —
      # это делает миссия, а не любой продуктовый коммит.
      - name: Узел допускает сборку к установке
        run: node tools/relay-build.mjs --repo . --json

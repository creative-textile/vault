name: CI

# Продуктовые проверки + локальный контур разработки через API.
# Транспорт ScriptCat и авто-коммит кадров в ветку удалены (D-125): браузерный
# контур Arena больше не нужен, кадры снимаются локально и уезжают артефактом.
# Сборка Docker-образов удалена (D-126): деплой — Vercel/Render/Supabase/GitHub Free.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: "Backend: типы и смоук-тесты"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: TypeScript без ошибок
        run: npx tsc --noEmit
      # Смоук-тесты работают на pg-mem (живая БД не нужна).
      - name: Смоук-тесты (7 режимов)
        run: npm test

  schema:
    name: Схема БД на PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault_pass
          POSTGRES_DB: vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: vault
      PGPASSWORD: vault_pass
      PGDATABASE: vault
    steps:
      - uses: actions/checkout@v4
      - name: init.sql применяется целиком
        run: psql -v ON_ERROR_STOP=1 -f backend/src/db/init.sql
      - name: init.sql идемпотентен (второй прогон)
        run: psql -v ON_ERROR_STOP=1 -f backend/src/db/init.sql
      - name: Проверка полноты схемы
        run: psql -v ON_ERROR_STOP=1 -f backend/src/db/schema-check.sql

  frontend:
    name: "Frontend: типы и сборка"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Математика 3D-анимаций и линт шейдеров
        run: npm test
      - name: Модели разбираются three.js
        run: |
          cd ..
          for f in frontend/public/models/*.glb; do
            node tools/modeling/validate_glb.mjs "$f"
          done
      - run: npm run build
      - name: Браузер для кадров сцен
        run: npx playwright install --with-deps chromium
      - name: Кадры 3D-сцен
        run: node tests/eyes/frames.mjs --frames 12
      - name: Артефакт с кадрами
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-frames
          path: frontend/frames/
          if-no-files-found: warn
          retention-days: 14

  bot:
    name: "Telegram-бот: типы и сборка"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  local-tools:
    name: "Локальный контур: бюджет, контекст, доска"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Проверки зашиты в tools/local/preflight.mjs, а не читаются из package.json.
      - run: npm run verify
      - name: Доска собрана из Git
        run: npm run board:check
